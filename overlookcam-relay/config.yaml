name: OverlookCam Relay
description: Connect local Frigate MQTT events to OverlookCam Cloud Push.
version: "0.1.0"
slug: overlookcam_relay
init: false
startup: services
boot: auto
host_network: true
map:
  - type: data
    read_only: false
options:
  source_home_name: "Home"
  source_home_mqtt_host: ""
  source_home_mqtt_port: 1883
  source_home_mqtt_user: ""
  source_home_mqtt_password: ""
  source_home_mqtt_topic: "frigate/events"
  source_home_push_cameras: ""
  source_store_enabled: false
  source_store_name: "Store"
  source_store_mqtt_host: ""
  source_store_mqtt_port: 1883
  source_store_mqtt_user: ""
  source_store_mqtt_password: ""
  source_store_mqtt_topic: "frigate/events"
  source_store_push_cameras: ""
schema:
  source_home_name: str
  source_home_mqtt_host: str
  source_home_mqtt_port: port
  source_home_mqtt_user: str?
  source_home_mqtt_password: password?
  source_home_mqtt_topic: str
  source_home_push_cameras: str?
  source_store_enabled: bool
  source_store_name: str
  source_store_mqtt_host: str?
  source_store_mqtt_port: port
  source_store_mqtt_user: str?
  source_store_mqtt_password: password?
  source_store_mqtt_topic: str
  source_store_push_cameras: str?
arch:
  - aarch64
  - amd64
  - armv7
