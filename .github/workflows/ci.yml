name: Home Assistant Relay CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate package layout
        shell: bash
        run: |
          set -euo pipefail
          required=(
            repository.yaml
            overlookcam-relay/config.yaml
            overlookcam-relay/CHANGELOG.md
            overlookcam-relay/build.yaml
            overlookcam-relay/Dockerfile
            overlookcam-relay/run.sh
            overlookcam-relay/relay.py
            overlookcam-relay/hosted_push.py
            overlookcam-relay/manager.py
            overlookcam-relay/server.py
            overlookcam-relay/requirements.txt
          )
          if [[ -f overlookcam-relay/camera_control.py ]]; then
            required+=(overlookcam-relay/camera_control.py)
          fi
          for path in "${required[@]}"; do
            [[ -f "$path" ]] || { echo "Missing Home Assistant package file: $path" >&2; exit 1; }
          done
          grep -q '^slug: overlookcam_relay$' overlookcam-relay/config.yaml
          grep -q '^boot: auto$' overlookcam-relay/config.yaml
          grep -q '^host_network: true$' overlookcam-relay/config.yaml
          bash -n overlookcam-relay/run.sh

      - name: Validate changelog for current version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: *"\([^"]*\)"/\1/p' overlookcam-relay/config.yaml | head -1)"
          [[ -n "$version" ]] || { echo "Could not read add-on version from config.yaml" >&2; exit 1; }
          grep -Fqx "## $version" overlookcam-relay/CHANGELOG.md || {
            echo "CHANGELOG.md is missing an entry for current add-on version $version" >&2
            exit 1
          }

      - name: Compile Python
        shell: bash
        run: |
          set -euo pipefail
          files=(
            overlookcam-relay/relay.py
            overlookcam-relay/hosted_push.py
            overlookcam-relay/pair.py
            overlookcam-relay/claim.py
            overlookcam-relay/manager.py
            overlookcam-relay/server.py
          )
          if [[ -f overlookcam-relay/camera_control.py ]]; then
            files+=(overlookcam-relay/camera_control.py)
          fi
          python3 -m py_compile "${files[@]}"

      - name: Build Home Assistant amd64 image
        shell: bash
        run: |
          docker build \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base-python:3.12-alpine3.20 \
            -t overlookcam-relay-ha:test \
            overlookcam-relay
