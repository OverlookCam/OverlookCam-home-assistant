name: OverlookCam Relay
description: Connect local Frigate MQTT events to OverlookCam Cloud Push.
version: "0.2.7"
slug: overlookcam_relay
init: false
startup: services
boot: auto
host_network: true
ingress: true
ingress_port: 8099
panel_icon: mdi:cctv
map:
  - type: data
    read_only: false
arch:
  - aarch64
  - amd64
  - armv7
options:
  floodlight_camera: ""
  floodlight_host: ""
  floodlight_username: ""
  floodlight_password: ""
  floodlight_verify_ssl: false
schema:
  floodlight_camera: str?
  floodlight_host: str?
  floodlight_username: str?
  floodlight_password: str?
  floodlight_verify_ssl: bool
