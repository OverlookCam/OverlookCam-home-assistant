name: OverlookCam Relay
description: Connect local Frigate MQTT events to OverlookCam Cloud Push.
version: "0.1.1"
slug: overlookcam_relay
init: false
startup: services
boot: auto
host_network: true
map:
  - type: data
    read_only: false
options:
  primary_name: "Frigate"
  primary_mqtt_host: ""
  primary_mqtt_port: 1883
  primary_mqtt_user: ""
  primary_mqtt_password: ""
  primary_mqtt_topic: "frigate/events"
  primary_push_cameras: ""
  secondary_enabled: false
  secondary_name: "Frigate 2"
  secondary_mqtt_host: ""
  secondary_mqtt_port: 1883
  secondary_mqtt_user: ""
  secondary_mqtt_password: ""
  secondary_mqtt_topic: "frigate/events"
  secondary_push_cameras: ""
schema:
  primary_name: str
  primary_mqtt_host: str
  primary_mqtt_port: port
  primary_mqtt_user: str?
  primary_mqtt_password: password?
  primary_mqtt_topic: str
  primary_push_cameras: str?
  secondary_enabled: bool
  secondary_name: str
  secondary_mqtt_host: str?
  secondary_mqtt_port: port
  secondary_mqtt_user: str?
  secondary_mqtt_password: password?
  secondary_mqtt_topic: str
  secondary_push_cameras: str?
arch:
  - aarch64
  - amd64
  - armv7
